[project]
name = "global-reading-atlas"
version = "0.3.0"
description = "Public book-industry dashboard and reproducible analysis of reading, listening, genres and market evidence"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pycountry>=24.6", "geopandas>=1.0", "matplotlib>=3.9"]

[project.optional-dependencies]
analysis = ["nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "tinycss2>=1.5", "ipykernel>=6.29", "scipy>=1.14"]
dev = ["pytest>=8", "ruff>=0.12"]
streamlit = ["streamlit==1.66.1", "altair==6.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["dashboard", "work", "notebooks", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
